      file: "PrimeCoverPowerBandSolution.lean"
      sorry_count: 1
      axioms: [propext, Classical.choice, Quot.sound, sorryAx]
      comparator_config: "comparator.json"
    - declaration: "PrimeCoverPowerBand.palomar_terminalBand_primeCounting"
      file: "PrimeCoverPowerBandSolution.lean"
      sorry_count: 1
      axioms: [propext, Classical.choice, Quot.sound, sorryAx]
      comparator_config: "comparator.json"
    - declaration: "PrimeCoverPowerBand.palomar_almostAll_powerBand"
