# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Prescribed and almost-all power-band spectra of prime-cover graphs"
  description: >-
    Palomar-first Lean 4 formalization of prescribed ordered eigenvalues and
    density-one sub-block estimates for finite prime-cover graphs. The sharp
    terminal-band statements have range 21/61 < theta < 1/2. The D31 statements
    have range 0 < theta < 1/2, error a/log(X) plus a logarithmic multiple of
    sqrt(X/(a log(X))), quantitative terminal exception counts, and a global
    density-zero failure set. Both D31 almost-all proofs compile with standard
    axioms; the two sharp terminal-band proofs remain open.
  authors: ["Idris Ali Shaik"]
  license: "Apache-2.0"
  responsible_maintainers: ["Idris Ali Shaik"]

classification:
  arxiv: [math.CO, math.NT]
  msc2020: [05C50, 11N05]

sources:
  - title: "Prescribed Eigenvalues in Power Bands of Finite Prime-Cover Graphs"
    authors: ["Idris Ali Shaik"]
    type: "paper"
    relationship: "formalizes"
    note: >-
      Paper II mathematical source at prime-orthant-geometry commit
      df32cafb021c0ed90f14f045858525882d50ab9e, file
      draft/prescribed-eigenvalues-in-prime-cover-power-bands.md, SHA-256
      b145e0a4ed2078fca969ed127d00c73d8758a76b559971988501693c1b60cfa3.
      This identifies the native paper, not a completed Lean proof.
    license: "unknown"
    author_endorsement: "participated"
  - title: "Ordered comparison and density-one power-band estimates"
    authors: ["Idris Ali Shaik"]
    type: "other"
    relationship: "formalizes"
    note: >-
      D31 native proof record at the same mathematical-source commit, file
      analysis/paper2-ordered-comparison-strengthening-2026-09-09.md.
      Uses global PNT and full-star frame/complement estimates, not BHP or
      Guth--Maynard. This is native provenance, not formal closure.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/shaikidris/prime-star-spectra-formalization/tree/59176e4ce57e7d6578cafd1de0029fed6fc13ccf"
    relationship: "builds-on"
    note: "Pinned Paper I graph, star-forest, first-exit, and analytic infrastructure."

automation:
  methods:
    - method: "agent"
      framework: "OpenAI Codex"
      tool_setup: >-
        Human-directed mathematical specification and staged Lean proof work,
        using the repository proof ledger, pinned Lean/Mathlib dependencies,
        Lake builds, axiom audits, and local statement/dependency checks.
  notes: >-
    AI agents assisted with proof implementation, porting, documentation and
    verification. This records the workflow without asserting an exact model
    inventory for earlier runs or a separate human line-by-line proof review.

